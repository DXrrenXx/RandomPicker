name: 构建 Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 发布程序（自包含，无需安装运行时）
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Recurse -Filter "RandomPicker.csproj" |
                    Where-Object { $_.FullName -notmatch '\\\.git\\' } |
                    Select-Object -First 1
          if (-not $csproj) {
            Write-Host "::error::仓库里找不到 RandomPicker.csproj。请确认上传的是解压后的源码内容（RandomPicker.csproj、Views、Models、Services、.github 等文件和文件夹），GitHub 不会自动解压 zip 压缩包。"
            exit 1
          }
          Write-Host "找到项目文件：$($csproj.FullName)"
          dotnet publish $csproj.FullName -c Release -r win-x64 -p:Platform=x64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true -o publish -v diag

      - name: 打包 ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath RandomPicker.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: RandomPicker-EXE
          path: RandomPicker.zip
