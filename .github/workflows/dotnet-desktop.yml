name: 构建 Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 发布程序（自包含，无需安装运行时）
        run: >
          dotnet publish RandomPicker/RandomPicker.csproj
          -c Release -r win-x64 -p:Platform=x64
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -o publish

      - name: 打包 ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath RandomPicker.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: RandomPicker-EXE
          path: RandomPicker.zip
