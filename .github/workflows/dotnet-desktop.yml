name: 构建 Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 查找项目文件
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Recurse -Filter "RandomPicker.csproj" |
                    Where-Object { $_.FullName -notmatch '\\\.git\\' } |
                    Select-Object -First 1
          if (-not $csproj) {
            Write-Host "::error::仓库里找不到 RandomPicker.csproj。请确认上传的是解压后的源码内容（RandomPicker.csproj、Views、Models、Services、.github 等文件和文件夹），GitHub 不会自动解压 zip 压缩包。"
            exit 1
          }
          Write-Host "找到项目文件：$($csproj.FullName)"
          "CSPROJ=$($csproj.FullName)" >> $env:GITHUB_ENV

      - name: 添加 Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 还原依赖
        run: msbuild $env:CSPROJ -t:Restore -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -v:m

      - name: 构建并发布（自包含，无需安装运行时）
        run: >
          msbuild $env:CSPROJ -t:Publish
          -p:Configuration=Release -p:Platform=x64
          -p:RuntimeIdentifier=win-x64
          -p:SelfContained=true
          -p:WindowsAppSDKSelfContained=true
          -p:PublishDir=${{ github.workspace }}\publish\
          -v:m -bl:${{ github.workspace }}\publish.binlog

      - name: 打包 ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath RandomPicker.zip

      - name: 失败时输出 XAML 编译器诊断
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse "obj" -Include "input.json","output.json" -ErrorAction SilentlyContinue |
          ForEach-Object {
            Write-Host "===== $($_.FullName) ====="
            Get-Content $_.FullName -TotalCount 120
          }

      - name: 失败时上传诊断日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 诊断日志-binlog
          path: publish.binlog
          if-no-files-found: ignore

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: RandomPicker-EXE
          path: RandomPicker.zip
