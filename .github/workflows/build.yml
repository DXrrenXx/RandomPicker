name: 构建 Windows EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]   # 推送 v1.0.0 之类的 tag 时构建并发布 Release
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write   # 允许创建 Release 并上传资产

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 发布程序（自包含，无需安装运行时）
        shell: pwsh
        run: |
          # 兼容两种仓库结构：csproj 直接在根目录，或在 RandomPicker 子目录
          $proj = Get-ChildItem -Recurse -Filter RandomPicker.csproj | Select-Object -First 1
          if (-not $proj) { throw "未找到 RandomPicker.csproj" }
          dotnet publish $proj.FullName -c Release -r win-x64 -p:Platform=x64 `
            -p:SelfContained=true -p:WindowsAppSDKSelfContained=true -o publish

      - name: 安装 Inno Setup
        run: choco install innosetup -y

      - name: 构建安装包
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: 打包 ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath RandomPicker.zip

      - name: 上传便携版 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RandomPicker-EXE
          path: RandomPicker.zip

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: RandomPicker-Setup
          path: installer/*.exe

      # 仅 tag 触发时执行：把构建产物发布到 GitHub Release
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            RandomPicker.zip
            installer/*.exe
